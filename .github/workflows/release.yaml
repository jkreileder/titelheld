name: Release

# A release is a signed tag you push by hand. Nothing here can start one.
#
#   git tag -s v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# That tag push builds the image once, signs it with SLSA provenance, deploys
# that exact digest to Cloud Run, and opens a draft GitHub release for you to
# edit and publish. See README.md, "Cutting a release".

# No workflow_dispatch. A dispatch on an existing tag would build a fresh
# image and deploy it without a new tag ever being signed, which is the one
# property this workflow exists to guarantee. Re-running a failed deploy is
# what "Re-run failed jobs" is for, and that reuses the same tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never cancel a run that publishes. Two tags pushed close together queue
# rather than race for the same Cloud Run service.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-release-version:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tag object itself, so it can be inspected below.
          fetch-depth: 0

      # A mistaken tag fails here, before anything is built or deployed.
      - name: Verify the tag
        env:
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          case "$REF" in
            refs/tags/*) ;;
            *)
              echo "::error::Release runs from a tag; got '$REF'. Run this workflow on a tag ref."
              exit 1
              ;;
          esac

          version="${TAG#v}"

          # Final SemVer only. A pre-release or build-metadata tag would deploy
          # to the one production service, so refuse it rather than guess.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to release non-final version '$version' from tag $TAG"
            exit 1
          fi

          # An annotated tag carries a message and a signature; a lightweight
          # tag carries neither.
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. Release tags must be annotated and signed (git tag -s)."
            exit 1
          fi

          echo "Releasing $TAG (version $version)."

      # The Tag v* ruleset requires signatures, but a ruleset can be edited and
      # a fork has none, so the release verifies the signature itself rather
      # than inheriting the guarantee. GitHub is asked, not git: verifying
      # locally would mean shipping the signing key to the runner.
      - name: Verify the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          sha=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')
          verified=$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq '.verification.verified')
          reason=$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq '.verification.reason')

          if [ "$verified" != "true" ]; then
            echo "::error::$TAG is not a verified signed tag (reason: ${reason}). Use git tag -s."
            exit 1
          fi

          echo "$TAG carries a verified signature."

      - name: Check the changelog has an entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing."
            exit 1
          fi

          heading=$(grep -F "## [$TAG]" CHANGELOG.md || true)

          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section."
            exit 1
          fi

          # The section exists but still carries the placeholder date, so the
          # release notes were never written. Date it before tagging.
          if printf '%s' "$heading" | grep -qi 'unreleased'; then
            echo "::error::CHANGELOG.md still marks $TAG as Unreleased: $heading"
            exit 1
          fi

          echo "Changelog entry: $heading"

  image:
    name: Image
    needs: check-release-version
    # Skips rather than fails until the infrastructure exists and the
    # repository variables are set from the Terraform outputs. A release job
    # that is permanently red teaches everyone to ignore it.
    if: ${{ vars.WIF_PROVIDER != '' && vars.DEPLOY_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT != '' && vars.GCP_REGION != '' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yaml
    with:
      environment: production

  deploy:
    name: Deploy to Cloud Run
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Federation requires this environment claim, so naming it here is not
    # decoration: a workflow that omits it cannot assume the deploy identity
    # even from this repository. Protection rules on the environment — required
    # reviewers, say — therefore become protection rules on deploying.
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          # gcloud is not in the runner's hosted tool cache, so setup-gcloud
          # resolves its version from raw.githubusercontent.com and downloads
          # the SDK from dl.google.com on every run.
          #
          # REGION-run.googleapis.com is where `gcloud run` actually goes;
          # run.googleapis.com alone is not enough. Without the regional host
          # the DNS request is dropped, gcloud retries for half a minute, and
          # the failure surfaces as though the service were missing.
          #
          # serviceusage is checked before the deploy itself: gcloud asks
          # whether run.googleapis.com is enabled on the project, and crashes
          # on a name-resolution error if it cannot ask.
          #
          # All three are required, and this job runs *after* the image has
          # been published, so getting them wrong strands a released image.
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            accounts.google.com:443
            api.github.com:443
            artifactregistry.googleapis.com:443
            dl.google.com:443
            github.com:443
            iamcredentials.googleapis.com:443
            oauth2.googleapis.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            run.googleapis.com:443
            serviceusage.googleapis.com:443
            storage.googleapis.com:443
            sts.googleapis.com:443
            ${{ vars.GCP_REGION }}-run.googleapis.com:443

      # This job never checks the repository out - it deploys an image that
      # already exists and needs no source - so the action warns that the
      # workspace is empty and suggests create_credentials_file: false. Leave
      # it on: gcloud below reads the file it writes, through
      # GOOGLE_APPLICATION_CREDENTIALS. The warning is about where the file
      # lands, not whether it works, and adding a checkout to silence it would
      # be clone traffic for nothing.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # By digest, never by tag. The version tags exist for humans; what runs
      # is the exact image the attestation covers, so a tag moved afterwards
      # cannot change it.
      #
      # Only the image is set here. Everything else about the service — the
      # service account, the scaling bounds, the environment, the secret
      # references — belongs to Terraform, which ignores the image in return.
      # The writes gate, before the deploy rather than after it.
      #
      # Releasing a version must never be the thing that turns writes on:
      # there is no version number that means "now write to Strava". This used
      # to be checked after `gcloud run deploy`, which made it a report of
      # something that had already happened — the revision was live and naming
      # by the time the job went red.
      #
      # The existing service predicts the new revision. `gcloud run deploy`
      # here sets the image and nothing else; every environment variable
      # belongs to Terraform, which ignores the image in return. So a revision
      # deployed by this job inherits the environment of the one running now,
      # and reading it beforehand answers the question this gate is asking.
      #
      # The escape hatch is a repository variable, not a flag on the tag: the
      # day writes are switched on, DRY_RUN=0 will be a Terraform change that
      # was reviewed and applied, and WRITES_ACKNOWLEDGED=1 is the second,
      # separate act that says the release is meant to carry it. Setting a
      # repository variable is visible, dated and revocable; a tag is not.
      - name: Check the service the deploy will land on
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          WRITES_ACKNOWLEDGED: ${{ vars.WRITES_ACKNOWLEDGED }}
        run: |
          set -euo pipefail

          # `gcloud run deploy` creates the service when it cannot find one,
          # so a renamed service or a wrong region would quietly produce a
          # second, Terraform-less service with the default compute identity
          # and no DRY_RUN. Require the managed service to exist first — and
          # do it here rather than in the deploy step, because the read below
          # would otherwise fail first and report gcloud's raw error instead
          # of what to do about it.
          #
          # Report what gcloud said rather than naming a cause: "missing" and
          # "not allowed to look" fail this check identically, and the first
          # time it fired the service existed and the permission did not.
          if ! found=$(gcloud run services describe titelheld \
               --project="$PROJECT" --region="$REGION" --format='value(name)' 2>&1); then
            echo "::error::cannot read the Cloud Run service 'titelheld' in ${PROJECT}/${REGION}; gcloud reported:"
            printf '%s\n' "$found"
            echo "::error::If the service is genuinely absent, apply the Terraform first - this job updates a service, it does not create one."
            exit 1
          fi

          # Empty when the variable is absent, which fails the comparison
          # below and is the right way round: unreadable and unset both mean
          # "this job cannot show that writes are off".
          dry_run=$(gcloud run services describe titelheld \
            --project="$PROJECT" --region="$REGION" \
            --format='value(spec.template.spec.containers[0].env.filter("name:DRY_RUN").extract("value"))')

          # gcloud renders a repeated field as ['1'] and a scalar as 1
          # depending on the version, so both spellings are accepted; anything
          # else, including the empty string, is not.
          if [ "$dry_run" = "['1']" ] || [ "$dry_run" = "1" ]; then
            echo "DRY_RUN is on; the revision this deploys cannot write to Strava."
            exit 0
          fi

          if [ "$WRITES_ACKNOWLEDGED" = "1" ]; then
            echo "::warning::the running service has DRY_RUN='${dry_run}' and WRITES_ACKNOWLEDGED=1 is set: this release deploys a revision that CAN write to Strava."
            exit 0
          fi

          echo "::error::the service this would deploy to does not have DRY_RUN=1 (got '${dry_run}'), and no revision has been deployed."
          echo "::error::Enabling writes is a Terraform change plus the repository variable WRITES_ACKNOWLEDGED=1. Releasing is not how writes get turned on."
          exit 1

      - name: Deploy the revision
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "Deploying ${IMAGE}@${DIGEST} (tag ${TAG})."

          # The step above read this service and refused to continue if it
          # could not, so `gcloud run deploy` cannot reach the case where it
          # creates a service instead of updating one.
          gcloud run deploy titelheld \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="${IMAGE}@${DIGEST}" \
            --quiet

      - name: Report what is running
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          WRITES_ACKNOWLEDGED: ${{ vars.WRITES_ACKNOWLEDGED }}
        run: |
          set -euo pipefail

          gcloud run services describe titelheld \
            --project="$PROJECT" --region="$REGION" \
            --format='value(status.url, status.latestReadyRevisionName)'

          # The same read again, now against the revision that was deployed.
          # The gate before the deploy is what prevents a writing revision;
          # this one checks that the prediction it made was right — that the
          # environment really did carry over, and that nothing changed the
          # service out of band while the image was being pushed.
          dry_run=$(gcloud run services describe titelheld \
            --project="$PROJECT" --region="$REGION" \
            --format='value(spec.template.spec.containers[0].env.filter("name:DRY_RUN").extract("value"))')

          if [ "$dry_run" = "['1']" ] || [ "$dry_run" = "1" ]; then
            echo "DRY_RUN is on; the deployed service cannot write to Strava."
            exit 0
          fi

          if [ "$WRITES_ACKNOWLEDGED" = "1" ]; then
            echo "::warning::the deployed service has DRY_RUN='${dry_run}': it CAN write to Strava, as WRITES_ACKNOWLEDGED=1 acknowledged."
            exit 0
          fi

          echo "::error::the deployed service does not have DRY_RUN=1 (got '${dry_run}') - the pre-deploy check disagreed, so the service changed underneath this job"
          exit 1

  draft-release:
    name: Create draft release
    needs:
      - check-release-version
      - image
      - deploy
    # Both image and deploy are skipped until the infrastructure variables are
    # set, and a draft release is still right in that case. `skipped` cannot be
    # told apart from "an upstream job failed", though, so failure and
    # cancellation are checked on each of them explicitly — otherwise a build
    # that never produced an image would still be drafted as a release.
    if: >-
      ${{ always()
      && needs.check-release-version.result == 'success'
      && needs.image.result != 'failure' && needs.image.result != 'cancelled'
      && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled'
      && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443

      # A draft, not a published release: the last step of a release is yours,
      # the same way the tag was.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --verify-tag \
            --generate-notes
