name: Lint, test, and scan

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:  # no base filter: stacked PRs target another PR's branch

permissions:
  contents: read

# Cancel superseded PR/branch runs, but never cancel tag runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            auth.docker.io:443
            gcr.io:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth for the toolchain version; Renovate keeps
          # the go directive current.
          go-version-file: go.mod
          check-latest: true
          # No module cache on tag runs: the release path must not be able to
          # consume a cache a pull-request run could have poisoned.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Verify go.mod is tidy
        run: |
          go mod tidy -diff

      - name: Build
        run: go build ./...

      # The store's claim is that Firestore behaves exactly like the in-memory
      # implementation, so the shared conformance suite runs against a real
      # emulator — in this job rather than its own, so one coverage profile
      # covers every package. Nothing here touches a GCP project: with
      # FIRESTORE_EMULATOR_HOST set the client library never contacts Google
      # and the project ID is a placeholder. The image is pinned by digest like
      # every other third-party artifact here.
      - name: Start the Firestore emulator
        run: |
          docker run -d --rm -p 127.0.0.1:8080:8080 --name firestore-emulator \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators@sha256:25300472f1fa63b4df0e0c3a5dd67bdc6774b39f6dd440605e520a6d04ae0f26 \
            gcloud emulators firestore start --host-port=0.0.0.0:8080

          # Wait for the emulator to say it is running, not for the port to be
          # bound. Docker's userland proxy binds the published port the moment
          # the container starts, so a TCP probe succeeds immediately and the
          # test step then races the emulator's ~15 s JVM startup — losing
          # intermittently, in a way that looks unrelated to the change.
          for _ in $(seq 1 90); do
            if docker logs firestore-emulator 2>&1 | grep -q "Dev App Server is now running"; then
              echo "emulator ready"
              exit 0
            fi

            if [ -z "$(docker ps -q -f name=firestore-emulator)" ]; then
              echo "::error::the Firestore emulator container exited"
              docker logs firestore-emulator
              exit 1
            fi

            sleep 2
          done

          echo "::error::the Firestore emulator never became ready"
          docker logs firestore-emulator
          exit 1

      # Via make so CI and the local target cannot drift; gotestsum wraps the
      # same `go test` run and additionally writes the JUnit report that
      # Codecov's test analytics consumes.
      - name: Test
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: make test-junit

      # The emulator tests skip by design when FIRESTORE_EMULATOR_HOST is
      # unset, and a suite of skips is indistinguishable from a suite of passes.
      # Assert they actually ran, or the emulator above is decorative.
      - name: Verify the Firestore tests ran rather than skipped
        run: |
          if ! grep -q "TestFirestoreConformance" test-results.xml; then
            echo "::error::the Firestore conformance suite did not run"
            exit 1
          fi

          if grep -q "<skipped" test-results.xml; then
            echo "::error::tests were skipped; the emulator was not reachable"
            grep -o 'name="[^"]*"[^>]*>[[:space:]]*<skipped' test-results.xml || true
            exit 1
          fi

      - name: Stop the emulator
        if: always()
        run: docker rm -f firestore-emulator || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in step with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.13.1

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::gofmt found unformatted files:"; gofmt -l .; exit 1; }

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            vuln.go.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # govulncheck reports only vulnerabilities that are actually reachable
      # from this module's call graph, and covers the standard library and the
      # toolchain as well as third-party modules.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  upload-to-codecov:
    name: Upload to Codecov
    # The Codecov upload runs in its own job so the third-party uploader only
    # ever sees the coverage profile — never the workspace of the jobs that
    # build or scan — and its egress stays out of the test job's allowlist.
    # Runs even when the test job failed so a red run still reports coverage.
    if: ${{ !cancelled() }}
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            cli.codecov.io:443
            codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            o26192.ingest.us.sentry.io:443
            storage.googleapis.com:443
            uploader.codecov.io:443

      # The codecov CLI fixes report paths against the source tree.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # continue-on-error: neither artifact exists when the test job died
      # before the run produced them; the upload steps then warn about the
      # missing file instead of failing.
      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./test-results.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
