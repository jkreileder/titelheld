name: Docker

# Builds the image on every pull request and every push to main, and never
# publishes anything.
#
# The release path (release.yaml -> release-image.yaml) is the only thing that
# pushes, and it runs only from a tag. Without this workflow the first CI build
# of the Dockerfile would be the release itself, which is a poor moment to
# discover that it no longer builds.
#
# This job holds no credentials and needs none: nothing is pushed, so there is
# no registry to log in to and no identity to federate. That is why it can run
# on pull requests without the per-step event guards a publishing workflow
# would need.

on:
  push:
    branches:
      - "main"
  pull_request:  # no base filter: stacked PRs target another PR's branch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          # The base images and the Go module proxy, and nothing else. No
          # registry to push to, no Google endpoints: this job cannot publish
          # even if it wanted to.
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            auth.docker.io:443
            gcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # `load` rather than `push`: the image goes into the local daemon so the
      # smoke test below can run it, and nowhere else. The gha cache is
      # branch-scoped, and this job publishes nothing, so restoring from it
      # crosses no trust boundary. Release builds run cache-free.
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: titelheld:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dry run is the safe zero value, and an unconfigured service must refuse
      # to start rather than come up in some half-configured state. That is a
      # property of the binary, so it is worth one assertion here: a distroless
      # or nonroot regression that stopped the binary running at all would
      # otherwise only show up at release time.
      - name: Refuse to start without configuration
        run: |
          set -euo pipefail

          if docker run --rm --network=none titelheld:ci; then
            echo "::error::the image started with no configuration; it must fail closed"
            exit 1
          fi

          echo "The image refuses to start unconfigured, as it should."

      - name: Report the image
        run: |
          set -euo pipefail

          docker image inspect titelheld:ci \
            --format 'user={{.Config.User}} entrypoint={{.Config.Entrypoint}} size={{.Size}}'
