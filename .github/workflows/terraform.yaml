name: Terraform

on:
  push:
    branches:
      - "main"
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yaml"
  pull_request:  # no base filter: stacked PRs target another PR's branch
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    # Format, validate and lint only. This workflow never applies, and holds no
    # credentials that could: infrastructure changes are applied by hand.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.terraform.io:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive -diff

      # -backend=false: the real backend is a GCS bucket this job has no
      # credentials for, and validation does not need state.
      - name: Initialize without a backend
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=infra validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Lint
        run: |
          cd infra
          tflint --init
          tflint --format compact
        env:
          # tflint downloads its google ruleset from GitHub releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
