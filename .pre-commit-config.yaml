repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: pretty-format-json
        args: [--autofix, --indent=4]
  # The Go hooks run from the local toolchain so they match `make lint` and CI
  # exactly; the pinned linter version lives in the Makefile.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
        require_serial: true
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: golangci-lint
        name: golangci-lint
        entry: make lint
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      # Lints GitHub Actions workflows; runs shellcheck on run: blocks when
      # shellcheck is on PATH. Degrades to YAML/expression checks otherwise.
      - id: actionlint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      # Shell that lives in a file rather than in a `run:` block. actionlint
      # covers the workflows' inline shell; this covers the scripts they call,
      # which is where the logic worth testing ended up.
      #
      # shellcheck-py rather than koalaman's own hook, which is a docker_image
      # hook: it pulls from Docker Hub, and every workflow here runs under a
      # blocked egress policy that does not allow registry-1.docker.io. It
      # passed locally, where Docker could reach the registry, and failed in
      # CI — which is the argument for the wheel, since PyPI is already
      # allowed for the hooks that need it.
      - id: shellcheck
        args: [--severity=style]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb  # frozen: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent=2, --case-indent]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
    hooks:
      # Security audit of GitHub Actions workflows (template injection,
      # credential persistence, cache poisoning, ...); complements actionlint,
      # which checks correctness.
      - id: zizmor
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 51e970fc00c4b2e76dfcfa2e8362d8a89240c0f5  # frozen: 44.48.3
    hooks:
      - id: renovate-config-validator
        args: [--strict]
